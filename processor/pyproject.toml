[project]
name = "doc-processor"
version = "0.1.0"
description = "Сервис обработки документов: извлечение текста, правила, NER, LLM"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    # предупреждения сторонних библиотек (SWIG в PyMuPDF, starlette), не нашего кода
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # pymorphy2 (зависимость natasha) импортирует pkg_resources; setuptools закреплён на 80.9.0
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]

[tool.coverage.run]
source = ["app", "evaluation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
